name: Complete Songbook Cronjob

on:
  schedule:
    # Run once a day. The complete songbook only changes when a song sheet
    # does, so hourly runs regenerated an identical 22 MB PDF ~23 times a day.
    - cron: "0 4 * * *"
  workflow_dispatch: {} # For manual runs

permissions:
  contents: read

jobs:
  generate-complete-songbook:
    name: Generate Complete Songbook
    uses: ./.github/workflows/generate-songbook.yaml
    with:
      edition: "complete"
    secrets: inherit
