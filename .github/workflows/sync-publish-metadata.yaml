name: Sync Publish Metadata

# Applies visibility/pinned changes from edition configs to the already
# published latest.json files in GCS, without regenerating any songbook.
on:
  push:
    branches: [main]
    paths:
      - 'generator/config/songbooks/**'
  workflow_dispatch:

jobs:
  sync-publish-metadata:
    name: Sync publish metadata to GCS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Load environment variables
      uses: falti/dotenv-action@v1.1.4
      with:
        path: .env
        export-variables: true
        keys-case: bypass

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Sync publish metadata
      run: uv run .github/scripts/sync-publish-metadata.py "${GCS_SONGBOOKS_BUCKET}"
