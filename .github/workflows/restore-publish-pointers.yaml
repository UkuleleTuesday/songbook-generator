name: Restore Publish Pointers

# Applies the one-off latest.json pointer restores listed in
# .github/restore-pointers.yml — rolling editions back to an earlier
# published artifact without regenerating anything.
on:
  push:
    branches: [main]
    paths:
      - '.github/restore-pointers.yml'
  workflow_dispatch:

# Serialized with the sync-publish-metadata workflow: both rewrite
# <edition>/latest.json, and one push can trigger both.
concurrency:
  group: songbooks-bucket-metadata
  cancel-in-progress: false

jobs:
  restore-publish-pointers:
    name: Restore latest.json pointers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Load environment variables
      uses: falti/dotenv-action@v1.1.4
      with:
        path: .env
        export-variables: true
        keys-case: bypass

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

    - name: Restore pointers
      run: uv run .github/scripts/restore-publish-pointers.py "${GCS_SONGBOOKS_BUCKET}"
